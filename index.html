<!DOCTYPE html>
<html lang="ne" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NepalHub - Complete all-in-one shop management</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="192x192" href="aio.png">
    <meta name="description" content="Complete all-in-one shop management by Kamal G.C.">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class' }</script>
    <!-- Lucide Icons & Nepali Date -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/nepali-date-converter@3.3.1/dist/nepali-date-converter.umd.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-100 text-slate-900 dark:bg-[#0b0f19] dark:text-slate-100 min-h-screen flex flex-col items-center justify-start font-sans-nepali">

    <!-- स्प्ल्याश स्क्रिन -->
    <div id="splash-screen" class="fixed inset-0 z-[200] flex flex-col items-center justify-center bg-gradient-to-br from-slate-900 to-slate-950 text-white transition-opacity duration-500">
        <div class="w-28 h-28 rounded-3xl bg-slate-900 border border-cyan-500/40 flex items-center justify-center shadow-2xl">
            <img src="aio.png" alt="Logo" class="w-full h-full object-cover">
        </div>
        <h1 class="text-2xl font-black mt-4">NepalHub</h1>
    </div>

    <!-- मुख्य ड्यासबोर्ड कन्टेनर (यहाँ HIDDEN छैन) -->
    <div id="dashboard-container" class="w-full max-w-md min-h-screen bg-white dark:bg-[#0d1322] flex flex-col relative pb-24">
        
        <header class="p-3 bg-white/90 dark:bg-[#0d1322]/90 border-b border-slate-800/60 flex items-center justify-between sticky top-0 z-30 backdrop-blur-md">
            <div class="flex items-center gap-2.5">
                <button onclick="toggleSidebar()" class="w-10 h-10 rounded-xl bg-slate-800 border border-slate-700 flex items-center justify-center text-slate-200">
                    <i data-lucide="menu" class="w-5 h-5"></i>
                </button>
                <div>
                    <h1 id="header-shop-name" class="text-white font-bold text-base">NepalHub</h1>
                    <p id="header-owner-name" class="text-cyan-400 text-[11px]">साहुजी: Kamal G.C.</p>
                </div>
            </div>
            <button onclick="toggleTheme()" class="p-1.5 bg-slate-800 text-amber-400 rounded-lg border border-slate-700">
                <i data-lucide="sun" class="w-4 h-4"></i>
            </button>
        </header>

        <main id="app-container" class="p-3.5 space-y-4 flex-1 overflow-y-auto">
            <!-- यहाँ ग्रिड लेआउट लोड हुन्छ -->
        </main>

        <!-- तलको नेभिगेसन बार -->
        <div class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-md bg-[#080c14]/95 border-t border-slate-800 backdrop-blur-md px-2 py-2 z-40">
            <div class="grid grid-cols-5 items-center text-center">
                <button onclick="switchPage('home')" id="nav-home" class="flex flex-col items-center gap-1 text-cyan-400 font-bold">
                    <i data-lucide="home" class="w-5 h-5"></i><span class="text-[10px]">होम</span>
                </button>
                <button onclick="switchPage('inventory')" id="nav-inventory" class="flex flex-col items-center gap-1 text-slate-400">
                    <i data-lucide="package" class="w-5 h-5"></i><span class="text-[10px]">स्टक</span>
                </button>
                <button onclick="toggleCalculator(true)" class="-mt-8 w-14 h-14 rounded-full bg-emerald-500 text-slate-950 flex items-center justify-center shadow-lg border-4 border-[#0d1322]">
                    <i data-lucide="calculator" class="w-6 h-6"></i>
                </button>
                <button onclick="switchPage('udharo')" id="nav-udharo" class="flex flex-col items-center gap-1 text-slate-400">
                    <i data-lucide="users" class="w-5 h-5"></i><span class="text-[10px]">उधारो</span>
                </button>
                <button onclick="switchPage('pos')" id="nav-pos" class="flex flex-col items-center gap-1 text-slate-400">
                    <i data-lucide="shopping-cart" class="w-5 h-5"></i><span class="text-[10px]">POS</span>
                </button>
            </div>
        </div>
    </div>

    <!-- कम्पोनेन्ट फाइलहरू -->
    <script src="components/sidebar.js"></script>
    <script src="components/pos.js"></script>
    <script src="components/inventory.js"></script>
    <script src="components/udharo.js"></script>
    <script src="components/finance.js"></script>
    <script src="components/tax.js"></script>
    <script src="components/calendar.js"></script>
    <script src="components/settings.js"></script>
    <script src="components/calculator.js"></script>
    <script src="components/lowStock.js"></script>
    <script src="main.js"></script>

    <script>
        // स्प्ल्याश स्क्रिन हटाउने र एप सुरु गर्ने
        window.addEventListener('load', () => {
            setTimeout(() => {
                const splash = document.getElementById('splash-screen');
                if (splash) {
                    splash.style.opacity = '0';
                    setTimeout(() => splash.style.display = 'none', 500);
                }
                // लुकेको ड्यासबोर्ड सिधै देखाउने
                document.getElementById('dashboard-container').classList.remove('hidden');
                lucide.createIcons();
            }, 1000);
        });
    </script>
</body>
</html>
