<!DOCTYPE html>
<html lang="ne" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NepalHub - Complete shop management</title>

    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="192x192" href="aio.png">
    <link rel="apple-touch-icon" href="aio2.png">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class' }</script>
    
    <!-- Icons & Utilities -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/nepali-date-converter@3.3.1/dist/nepali-date-converter.umd.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Mukta:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-100 text-slate-900 dark:bg-[#0b0f19] dark:text-slate-100 min-h-screen flex flex-col items-center justify-start font-sans">

    <!-- टोस्ट म्यासेज -->
    <div id="toast-container" class="fixed top-5 left-1/2 -translate-x-1/2 z-[300] pointer-events-none transition-all duration-300 opacity-0 transform -translate-y-4">
        <div id="toast-message" class="bg-emerald-500 text-slate-950 font-bold px-4 py-2.5 rounded-xl shadow-2xl text-xs flex items-center gap-2">
            <span>✅</span> <span id="toast-text">सफल भयो!</span>
        </div>
    </div>

    <!-- स्प्ल्याश स्क्रिन -->
    <div id="splash-screen" class="fixed inset-0 z-[200] flex flex-col items-center justify-between bg-gradient-to-br from-slate-900 via-teal-950 to-slate-950 text-white p-6 transition-opacity duration-500 ease-in-out">
        <div class="w-full h-8"></div>
        <div class="flex flex-col items-center text-center">
            <div class="relative mb-5">
                <div class="relative w-24 h-24 rounded-3xl flex items-center justify-center bg-slate-900 border border-cyan-500/40 text-cyan-400 font-black text-2xl shadow-2xl">
                    NH
                </div>
            </div>
            <h1 class="text-2xl font-black text-white">NepalHub</h1>
            <p class="text-cyan-400 text-xs font-semibold mt-1">Complete all-in-one shop management</p>
        </div>
        <div class="text-center pb-2">
            <p class="text-[11px] text-slate-400">© 2026 <span class="text-cyan-400 font-bold">kamalgc.com.np</span></p>
        </div>
    </div>

    <!-- MAIN DASHBOARD CONTAINER -->
    <div id="dashboard-container" class="w-full max-w-md min-h-screen bg-white text-slate-900 border-x border-slate-200 dark:bg-[#0d1322] dark:text-slate-100 dark:border-slate-800 shadow-2xl flex flex-col relative pb-24">
        
        <!-- Header -->
        <header class="p-3 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between sticky top-0 bg-inherit z-30">
            <div class="flex items-center gap-2">
                <div class="w-9 h-9 rounded-xl bg-cyan-500/20 border border-cyan-500/40 flex items-center justify-center font-bold text-cyan-400">NH</div>
                <div>
                    <h1 id="header-shop-name" class="font-bold text-sm">NepalHub</h1>
                    <p id="header-owner-name" class="text-cyan-400 text-[10px]">Shop Manager</p>
                </div>
            </div>
        </header>

        <!-- Main Dynamic App Container -->
        <main id="app-container" class="p-3.5 space-y-4 flex-1 overflow-y-auto">
            <!-- Dynamic Components UI -->
        </main>

        <!-- Bottom Navigation -->
        <div class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-md bg-white dark:bg-[#080c14] border-t border-slate-200 dark:border-slate-800 p-2 z-40">
            <div class="grid grid-cols-4 items-center text-center">
                <button onclick="switchPage('home')" id="nav-home" class="text-cyan-400 font-bold text-xs flex flex-col items-center justify-center gap-1">
                    <span>होम</span>
                </button>
                <button onclick="switchPage('inventory')" id="nav-inventory" class="text-slate-400 text-xs flex flex-col items-center justify-center gap-1">
                    <span>स्टक</span>
                </button>
                <button onclick="switchPage('udharo')" id="nav-udharo" class="text-slate-400 text-xs flex flex-col items-center justify-center gap-1">
                    <span>उधारो</span>
                </button>
                <button onclick="switchPage('pos')" id="nav-pos" class="text-slate-400 text-xs flex flex-col items-center justify-center gap-1">
                    <span>POS</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Component Scripts -->
    <script src="components/calculator.js"></script>
    <script src="components/finance.js"></script>
    <script src="components/inventory.js"></script>
    <script src="components/lowStock.js"></script>
    <script src="components/pos.js"></script>
    <script src="components/settings.js"></script>
    <script src="components/sidebar.js"></script>
    <script src="components/taxAudit.js"></script>
    <script src="components/udharo.js"></script>

    <!-- Main JS -->
    <script src="main.js"></script>
</body>
</html>
